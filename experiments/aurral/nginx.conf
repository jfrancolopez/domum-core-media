# The ONLY ingress to Aurral. Aurral itself sits on an internal network with
# no gateway, so this proxy is what LAN and Tailscale clients reach.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  server_tokens off;
  client_max_body_size 64m;
  server {
    listen 8080;
    location / {
      proxy_pass http://aurral:3001;
      proxy_http_version 1.1;
      # $http_host, NOT $host: nginx's $host STRIPS THE PORT, and Aurral's
      # isCrossSite() compares the Origin header's host against the Host header.
      # Measured 2026-11-24 through this proxy, with an address nginx could not
      # have invented:
      #
      #   Host: example.test:9999 + Origin: http://example.test:9999  -> 403
      #   Host: example.test:9999 + Origin: http://example.test       -> 200
      #
      # Reversed from what verbatim forwarding would give, which is the proof.
      # With the port dropped, Origin "http://<addr>:3001" never matches Host
      # "<addr>", so every request from a browser that sends Origin WITHOUT
      # Sec-Fetch-Site was classified cross-site. In guards.ts that skips both
      # the pre-onboarding exemption and the "auth not required" early return,
      # so onboarding answered 401 "Authentication required" and the file
      # browser 403 "Admin access is required to browse storage paths" -- two
      # symptoms, one cause. It is not specific to the Tailscale address;
      # measured identically on the LAN address, because the port is what
      # differs, not the host.
      proxy_set_header Host $http_host;
      # Belt and braces: isCrossSite() also accepts a match against
      # X-Forwarded-Host, and this proxy is the only thing that sets it.
      # Measured: supplying it with the port returns 200 on its own.
      proxy_set_header X-Forwarded-Host $http_host;
      # OVERWRITE, never append: Aurral's GHSA-94q7-rfcf-xq9g / GHSA-4fgw-3fq7-w4mp
      # were both a client-supplied X-Forwarded-For being believed. Aurral trusts
      # only this proxy (TRUST_PROXY), and this proxy forwards only the real peer.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
    }
  }
}
