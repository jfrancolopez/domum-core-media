# The ONLY ingress to Aurral. Aurral itself sits on an internal network with
# no gateway, so this proxy is what LAN and Tailscale clients reach.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  server_tokens off;
  client_max_body_size 64m;
  server {
    listen 8080;
    location / {
      proxy_pass http://aurral:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # OVERWRITE, never append: Aurral's GHSA-94q7-rfcf-xq9g / GHSA-4fgw-3fq7-w4mp
      # were both a client-supplied X-Forwarded-For being believed. Aurral trusts
      # only this proxy (TRUST_PROXY), and this proxy forwards only the real peer.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
    }
  }
}
