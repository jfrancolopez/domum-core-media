name: compose-validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: bash -n bin/domum-media bin/domum-media-backup bin/domum-media-report install.sh

      - name: shellcheck
        # Fail on real warnings/errors; info-level notes (e.g. sourcing
        # /etc/os-release, intentional subshell-scoped exports) are advisory.
        run: shellcheck --severity=warning bin/domum-media bin/domum-media-backup bin/domum-media-report install.sh

      - name: Immich secret propagation smoke test
        run: tests/immich-secret-propagation-smoke.sh

      - name: Atomic Immich pg_dump smoke test
        run: tests/atomic-immich-pg-dump-smoke.sh

      - name: Restic SFTP configuration smoke test
        run: tests/restic-sftp-configuration-smoke.sh

      - name: Recovery-pack contents smoke test
        run: tests/recovery-pack-contents-smoke.sh

      - name: Operational report smoke test
        run: tests/operational-report-smoke.sh

      - name: Timer auto-enable safety smoke test
        run: tests/timer-auto-enable-safety-smoke.sh

      - name: Snapshot safety gate smoke test
        run: tests/snapshot-safety-gate-smoke.sh

      - name: Backup target evidence smoke test
        run: tests/backup-target-evidence-smoke.sh

      - name: Backup evidence end-to-end smoke test
        run: tests/backup-evidence-endtoend-smoke.sh

      - name: Restore verification smoke test
        run: tests/restore-verification-smoke.sh

      - name: Restore preserves state smoke test
        run: tests/restore-preserves-state-smoke.sh

      - name: Log hygiene smoke test
        run: tests/log-hygiene-smoke.sh

      - name: Storage migration failure smoke test
        run: tests/storage-migration-failure-smoke.sh

      - name: Sample verification smoke test
        run: tests/sample-verification-smoke.sh

      - name: Operation lock smoke test
        run: tests/operation-lock-smoke.sh

      - name: Rollback entry integrity smoke test
        run: tests/rollback-entry-integrity-smoke.sh

      - name: Subvolume detection smoke test
        run: tests/subvolume-detection-smoke.sh

      - name: Snapshot prune safety smoke test
        run: tests/snapshot-prune-safety-smoke.sh

      - name: Uptime Kuma dump smoke test
        run: tests/uptime-kuma-dump-smoke.sh

      - name: Captured stdout purity smoke test
        run: tests/captured-stdout-purity-smoke.sh

      - name: Storage topology smoke test
        run: tests/storage-topology-smoke.sh

      - name: Migration recovery point smoke test
        run: tests/migration-recovery-point-smoke.sh

      - name: Two migrated services smoke test
        run: tests/two-migrated-services-smoke.sh

      - name: Image identity preservation smoke test
        run: tests/image-identity-preservation-smoke.sh

      - name: Fail-closed recovery smoke test
        run: tests/fail-closed-recovery-smoke.sh

      # Symlinks, end to end, before plex -- the only remaining candidate with any.
      - name: Symlink verification smoke test
        run: tests/symlink-verification-smoke.sh

      # An image upgrade needs a recovery point for the state THAT service mutates.
      - name: Upgrade protection gate smoke test
        run: tests/upgrade-protection-gate-smoke.sh

      # `update` is repo_update, which execs `apply`. Same gate, by the real
      # production service names.
      - name: Update path gate smoke test
        run: tests/update-path-gate-smoke.sh

      # What the restarted service did to its state since the proof snapshot.
      # Plex-shaped: spaced paths, rotated logs, dated DB backups, symlinks.
      - name: Live tree classification smoke test
        run: tests/live-tree-classification-smoke.sh

      # A staged image must not refuse the migration (compose start cannot deploy
      # it), but an image that actually changed must fail it.
      - name: Staged image migration smoke test
        run: tests/staged-image-migration-smoke.sh

      # "I could not check this database" is not "it is broken".
      - name: SQLite unsupported classification smoke test
        run: tests/sqlite-unsupported-smoke.sh

      # `cleanup images` must not delete an image a container uses, nor one a
      # recovery point pairs with.
      - name: Cleanup image protection smoke test
        run: tests/cleanup-image-protection-smoke.sh

      # The complete rollback artifact for an upgrade: application-consistent
      # state + the exact old image + metadata tying them together.
      - name: Pre-upgrade point smoke test
        run: tests/pre-upgrade-point-smoke.sh

      # One service upgraded, proven to be one; rollback restores both halves.
      - name: Service upgrade smoke test
        run: tests/service-upgrade-smoke.sh

      # Docker must not start before /srv/data is mounted.
      - name: Boot mount dependency smoke test
        run: tests/boot-mount-dependency-smoke.sh

      # The python audits. These were written and then never wired in, so seven
      # suites were reported as "CI green" while CI had never run them.
      # tests/ci-coverage-audit.sh now fails when a test file is not listed here.
      - name: Library stdout purity audit
        run: python3 tests/lib-stdout-purity-audit.py

      - name: Reconcile boundary audit
        run: python3 tests/reconcile-boundary-audit.py

      # A runbook command that does not exist is discovered during a recovery.
      - name: Documented commands audit
        run: python3 tests/documented-commands-audit.py

      # Every test file must be named above. A suite that exists but is not run is
      # worse than no suite: it is reported as coverage.
      - name: Every test is wired into CI
        run: tests/ci-coverage-audit.sh

      # Skips cleanly where there is no Btrfs (as on the CI runner). It is the
      # real-primitives test and is meant to be run on the host:
      #   tests/integration/btrfs-migration-integration.sh
      - name: Btrfs migration integration test (skips without Btrfs)
        run: tests/integration/btrfs-migration-integration.sh

      # systemd-analyze verify cannot detect a unit invoking a subcommand the CLI
      # does not implement (CLAUDE.md section 9). This is that check.
      - name: systemd unit subcommands exist
        run: tests/unit-subcommands-exist-smoke.sh

      - name: systemd unit validation
        run: |
          sudo install -m 0755 bin/domum-media bin/domum-media-backup /usr/local/bin/
          systemd-analyze verify systemd/*.service systemd/*.timer

      - name: docker compose config (every fragment layered on base)
        run: |
          set -euo pipefail
          args=(-f compose/base.yml)
          while IFS= read -r f; do
            args+=(-f "$f")
          done < <(find compose -name '*.yml' -not -path 'compose/base.yml' -not -path '*/traefik/*' | sort)
          echo "Running: docker compose --env-file config/ci.env ${args[*]} config -q"
          docker compose --env-file config/ci.env "${args[@]}" config -q
