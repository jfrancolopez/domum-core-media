# Docker must not start a container before the filesystem backing its bind
# mounts is present.
#
# Seven of the eleven containers bind a path under /srv/data -- calibre-web,
# immich_server (library and postgres), jellyfin, kavita, navidrome, plex -- and
# all eleven are `restart: unless-stopped`, so the Docker daemon starts them
# itself at boot, without compose. If /srv/data were not mounted at that moment,
# Docker would CREATE the missing bind-mount sources under the empty mountpoint,
# on the OS disk (/dev/sdb2), and every one of those services would come up as a
# fresh install writing there. The later mount would then hide that data
# underneath a running service: a split-brain with two divergent copies and no
# obvious symptom.
#
# Today that cannot happen, but only incidentally: srv-data.mount is ordered
# Before=local-fs.target, local-fs.target is Before=sysinit.target, and
# docker.service is After=sysinit.target. The transitive ordering holds -- and
# docker.service's own RequiresMountsFor was EMPTY, with zero mount-related
# After= entries. Nothing recorded the requirement, so adding `nofail` to the
# fstab line, or moving the data to a device that appears late, would have
# removed the protection silently.
#
# RequiresMountsFor= makes it explicit: it adds both Requires= and After= on the
# mount units for these paths. If /srv/data cannot be mounted, Docker does not
# start -- which is the right failure: no containers beats containers writing to
# the wrong filesystem.
#
# WHAT IS DELIBERATELY NOT LISTED HERE
#
# /srv/media -- measured: a plain directory on /dev/sdb2, the root filesystem,
#   not a mount (`findmnt --target /srv/media` resolves to `/`). Five bind
#   sources live under it (jellyfin and plex caches, books, music, /srv/media
#   itself). There is no mount unit to depend on, so there is no dependency to
#   declare; the root filesystem is mounted before any unit runs.
#
# /srv/snapshots -- a real btrfs mount (/dev/sda1[/@snapshots]), but measured:
#   ZERO containers bind any path under it. Requiring it here would mean a
#   failure of a filesystem no container uses takes down all eleven containers.
#   The snapshot root is needed by the domum-media *units* that create, prune or
#   read snapshots, so the dependency belongs on those units, where it is
#   declared individually. See docs/REBOOT-READINESS.md.
#
# /etc/localtime, /opt/domum-core-media/..., /etc/domum-core-media/secrets/...,
#   /var/run/docker.sock -- on / and /run respectively; both are guaranteed
#   before any service starts.
#
# Never add `nofail` to the /srv/data fstab line.
[Unit]
RequiresMountsFor=/srv/data
