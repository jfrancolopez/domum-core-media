# Docker must not start before the protected storage is mounted.
#
# Every service's state is a bind mount from /srv/data, and all eleven containers
# have restart: unless-stopped -- so the Docker daemon starts them itself at boot,
# without compose. If /srv/data were not mounted at that moment, Docker would
# CREATE the missing bind-mount sources under the empty mountpoint, on the OS disk
# (/dev/sdb2), and every service would come up as a fresh install writing there.
# The later mount would then hide that data underneath a running service: a
# split-brain with two divergent copies and no obvious symptom.
#
# Today that cannot happen, but only incidentally: srv-data.mount and
# srv-snapshots.mount are ordered Before=local-fs.target, local-fs.target is
# Before=sysinit.target, and docker.service is WantedBy=multi-user.target. The
# transitive ordering holds -- and docker.service's own RequiresMountsFor was
# EMPTY, with zero mount-related After= entries. Nothing recorded the requirement,
# so adding `nofail` to an fstab line, or moving the data to a device that appears
# late, would have removed the protection silently.
#
# RequiresMountsFor makes it explicit: it adds both Requires= and After= on the
# mount units for these paths. If the storage cannot be mounted, Docker does not
# start -- which is the right failure: no containers beats containers writing to
# the wrong filesystem.
#
# /srv/media is deliberately absent: it is a directory on the OS disk, not a
# mount (measured: /srv/media -> /dev/sdb2 ext4, mountpoint=no), so there is no
# mount unit to depend on.
[Unit]
RequiresMountsFor=/srv/data /srv/snapshots
